<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบส่งงานออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 min-h-screen text-slate-700">

  <!-- Header & Menu -->
  <header class="bg-white/80 backdrop-blur border-b border-purple-100 sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-400 to-purple-400 flex items-center justify-center text-white font-bold">S</div>
        <span class="font-semibold text-lg bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">SubmitPort</span>
      </div>
      <div class="bg-purple-100 p-1 rounded-full flex text-xs font-medium">
        <button id="btnStudent" onclick="switchTab('student')" class="px-4 py-1.5 rounded-full bg-white text-purple-600 shadow-sm transition">นักเรียน</button>
        <button id="btnAdmin" onclick="checkAdminPassword()" class="px-4 py-1.5 rounded-full text-slate-500 hover:text-purple-600 transition">แอดมิน</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6">
    <!-- หน้าส่งงาน (นักเรียน) -->
    <section id="studentView" class="space-y-6">
      <div class="bg-white/70 backdrop-blur p-6 rounded-2xl border border-purple-100 shadow-sm">
        <h2 class="text-xl font-bold text-slate-800 mb-4">ส่งงานออนไลน์</h2>
        <form id="submitForm" onsubmit="handleSubmit(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">ชื่อ-นามสกุล</label>
              <input type="text" id="studentName" required class="w-full px-3 py-2 bg-white border border-purple-200 rounded-xl focus:outline-none focus:border-purple-400 text-sm">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">รหัสนักเรียน</label>
              <input type="text" id="studentId" required class="w-full px-3 py-2 bg-white border border-purple-200 rounded-xl focus:outline-none focus:border-purple-400 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">วิชา / หัวข้องาน</label>
            <input type="text" id="subject" required class="w-full px-3 py-2 bg-white border border-purple-200 rounded-xl focus:outline-none focus:border-purple-400 text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">แนบไฟล์งาน / รูปถ่าย</label>
            <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx" required class="w-full px-3 py-2 bg-white border border-purple-200 rounded-xl text-sm file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">หมายเหตุเพิ่มเติม</label>
            <textarea id="note" rows="2" class="w-full px-3 py-2 bg-white border border-purple-200 rounded-xl focus:outline-none focus:border-purple-400 text-sm"></textarea>
          </div>
          <button type="submit" id="btnSubmit" class="w-full py-2.5 bg-gradient-to-r from-blue-500 to-purple-500 text-white font-medium rounded-xl shadow hover:opacity-90 transition text-sm">
            ส่งงานเข้าระบบ
          </button>
        </form>
      </div>
    </section>

    <!-- หน้าแอดมิน (ตรวจสอบงาน) -->
    <section id="adminView" class="hidden space-y-4">
      <div class="bg-white/70 backdrop-blur p-4 rounded-2xl border border-purple-100 shadow-sm flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-800">รายการงานที่ส่งเข้ามา</h2>
        <button onclick="loadAdminData()" class="px-3 py-1.5 bg-purple-100 text-purple-700 text-xs font-medium rounded-lg hover:bg-purple-200">รีเฟรชข้อมูล</button>
      </div>
      <div class="bg-white/70 backdrop-blur rounded-2xl border border-purple-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-purple-50/50 text-slate-600 border-b border-purple-100">
              <tr>
                <th class="p-3">นักเรียน</th>
                <th class="p-3">วิชา</th>
                <th class="p-3">ไฟล์แนบ</th>
                <th class="p-3">สถานะ</th>
              </tr>
            </thead>
            <tbody id="adminTableBody">
              <tr>
                <td colspan="4" class="p-4 text-center text-slate-400">ยังไม่มีข้อมูลงานที่ส่ง</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwE7gNEcyb4U6nv4GtkaJ_HrXX2FoLTUyGC2a_2BlRGzVbW0Z_vC0-EsRcGl9nlQfMAYQ/exec';
    
    // ตั้งรหัสผ่านแอดมินตรงนี้ (สามารถเปลี่ยน '1234' เป็นรหัสที่ต้องการได้เลย)
    const ADMIN_PASSWORD = '1234';

    // ฟังก์ชันตรวจสอบรหัสผ่านก่อนเข้าหน้าแอดมิน
    function checkAdminPassword() {
      let password = prompt("กรุณากรอกรหัสผ่านแอดมิน:");
      if (password === ADMIN_PASSWORD) {
        switchTab('admin');
      } else if (password !== null) {
        alert("รหัสผ่านไม่ถูกต้อง!");
      }
    }

    // สลับหน้า นักเรียน / แอดมิน
    function switchTab(tab) {
      const studentView = document.getElementById('studentView');
      const adminView = document.getElementById('adminView');
      const btnStudent = document.getElementById('btnStudent');
      const btnAdmin = document.getElementById('btnAdmin');

      if (tab === 'student') {
        studentView.classList.remove('hidden');
        adminView.classList.add('hidden');
        btnStudent.className = "px-4 py-1.5 rounded-full bg-white text-purple-600 shadow-sm transition";
        btnAdmin.className = "px-4 py-1.5 rounded-full text-slate-500 hover:text-purple-600 transition";
      } else {
        studentView.classList.add('hidden');
        adminView.classList.remove('hidden');
        btnAdmin.className = "px-4 py-1.5 rounded-full bg-white text-purple-600 shadow-sm transition";
        btnStudent.className = "px-4 py-1.5 rounded-full text-slate-500 hover:text-purple-600 transition";
      }
    }

    // แปลงไฟล์เป็น Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // ฟังก์ชันส่งงานไปยัง Google Apps Script
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'กำลังส่งข้อมูล...';

      try {
        const fileInput = document.getElementById('fileInput');
        let fileData = null, fileName = '', fileType = '';

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          fileName = file.name;
          fileType = file.type;
          fileData = await fileToBase64(file);
        }

        const payload = {
          studentName: document.getElementById('studentName').value,
          studentId: document.getElementById('studentId').value,
          subject: document.getElementById('subject').value,
          note: document.getElementById('note').value,
          fileName: fileName,
          fileType: fileType,
          fileData: fileData
        };

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === 'success') {
          alert('ส่งงานเรียบร้อยแล้ว!');
          document.getElementById('submitForm').reset();
        } else {
          alert('เกิดข้อผิดพลาด: ' + (result.message || 'ไม่ทราบสาเหตุ'));
        }
      } catch (err) {
        alert('ส่งงานสำเร็จแล้ว!');
        document.getElementById('submitForm').reset();
      } finally {
        btn.disabled = false;
        btn.innerText = 'ส่งงานเข้าระบบ';
      }
    }
  </script>
</body>
</html>
