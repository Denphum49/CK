<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSubmit Mini - ระบบส่งงานออนไลน์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%); min-h-screen; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-700 min-h-screen flex flex-col justify-between">

    <div class="max-w-4xl mx-auto w-full space-y-6">
        
        <!-- Header & Role Switcher -->
        <header class="flex items-center justify-between bg-white/80 backdrop-blur-md p-4 rounded-2xl shadow-sm border border-white">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-400 text-white flex items-center justify-center font-bold">E</div>
                <h1 class="font-bold text-lg text-indigo-900">EduSubmit Mini</h1>
            </div>
            <button onclick="toggleRole()" id="role-btn" class="px-4 py-1.5 rounded-xl text-xs font-semibold bg-purple-100 text-purple-700 border border-purple-200 hover:bg-purple-200 transition">
                สลับเป็นมุมมอง: แอดมินผู้ตรวจ
            </button>
        </header>

        <!-- STUDENT VIEW -->
        <section id="student-view" class="bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-white space-y-4">
            <h2 class="text-base font-bold text-indigo-900 border-b border-indigo-50 pb-2">ส่งงานใหม่ (นักเรียน)</h2>
            <form onsubmit="handleSubmit(event)" class="space-y-4 text-xs">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="student-name" required placeholder="นายสมชาย ใจดี" class="w-full p-2.5 bg-indigo-50/30 border border-indigo-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">หัวข้อการบ้าน / วิชา</label>
                        <input type="text" id="assign-title" required placeholder="การงานอาชีพ - รายงาน UI/UX" class="w-full p-2.5 bg-indigo-50/30 border border-indigo-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold mb-1">ประเภทการส่ง</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center space-x-1.5 cursor-pointer">
                            <input type="radio" name="uploadType" value="file" checked onchange="handleTypeChange('file')" class="text-indigo-500">
                            <span>ไฟล์เอกสาร (PDF)</span>
                        </label>
                        <label class="flex items-center space-x-1.5 cursor-pointer">
                            <input type="radio" name="uploadType" value="photo" onchange="handleTypeChange('photo')" class="text-indigo-500">
                            <span>รูปถ่ายการบ้าน</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold mb-1">เลือกไฟล์ / รูปภาพ</label>
                    <input type="file" id="file-input" required onchange="previewFile(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200">
                    <div id="preview-box" class="mt-2 hidden">
                        <img id="img-preview" src="" alt="preview" class="max-h-32 rounded-lg border border-purple-200">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-400 to-purple-400 text-white font-semibold rounded-xl shadow hover:opacity-90 transition">
                    ส่งงานตอนนี้
                </button>
            </form>
        </section>

        <!-- ADMIN VIEW -->
        <section id="admin-view" class="hidden bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-white space-y-4">
            <h2 class="text-base font-bold text-indigo-900 border-b border-indigo-50 pb-2">รายการตรวจงาน (แอดมิน)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-indigo-50/70 text-indigo-900">
                            <th class="p-3 rounded-l-xl">ชื่อนักเรียน</th>
                            <th class="p-3">หัวข้อการบ้าน</th>
                            <th class="p-3">ไฟล์ / รูป</th>
                            <th class="p-3">สถานะ</th>
                            <th class="p-3 text-center rounded-r-xl">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-indigo-50">
                        <!-- Dynamic items -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- Minimal Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg opacity-0 transition pointer-events-none">
        แจ้งเตือน
    </div>

    <script>
        // State Array
        let currentRole = 'student';
        let submissions = [
            { id: 1, name: "นายสมชาย ใจดี", title: "การงานอาชีพ - UI/UX Report", type: "file", file: "report.pdf", status: "pending", preview: "" },
            { id: 2, name: "นางสาวมณี สุขใจ", title: "ศิลปะ - ภาพวาดสีน้ำ", type: "photo", file: "drawing.jpg", status: "approved", preview: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=150&q=80" }
        ];

        let selectedFilePreview = "";

        // UI Initialization
        document.addEventListener('DOMContentLoaded', renderAdminTable);

        // Role Toggle
        function toggleRole() {
            currentRole = currentRole === 'student' ? 'admin' : 'student';
            document.getElementById('student-view').classList.toggle('hidden', currentRole === 'admin');
            document.getElementById('admin-view').classList.toggle('hidden', currentRole === 'student');
            document.getElementById('role-btn').innerText = currentRole === 'student' ? 'สลับเป็นมุมมอง: แอดมินผู้ตรวจ' : 'สลับเป็นมุมมอง: นักเรียนส่งงาน';
        }

        // Preview File Function
        function previewFile(e) {
            const file = e.target.files[0];
            const previewBox = document.getElementById('preview-box');
            const imgPreview = document.getElementById('img-preview');
            
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    selectedFilePreview = evt.target.result;
                    imgPreview.src = selectedFilePreview;
                    previewBox.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                selectedFilePreview = "";
                previewBox.classList.add('hidden');
            }
        }

        function handleTypeChange(type) {
            document.getElementById('file-input').accept = type === 'photo' ? 'image/*' : '.pdf,.docx,.zip';
        }

        // Handle Student Submission
        function handleSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('student-name').value;
            const title = document.getElementById('assign-title').value;
            const fileInput = document.getElementById('file-input');
            const type = document.querySelector('input[name="uploadType"]:checked').value;

            submissions.unshift({
                id: Date.now(),
                name: name,
                title: title,
                type: type,
                file: fileInput.files[0] ? fileInput.files[0].name : 'homework_file',
                status: 'pending',
                preview: selectedFilePreview
            });

            e.target.reset();
            document.getElementById('preview-box').classList.add('hidden');
            selectedFilePreview = "";
            renderAdminTable();
            showToast("ส่งงานเรียบร้อยแล้ว!");
        }

        // Render Admin Review Table
        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = submissions.map(item => `
                <tr class="hover:bg-purple-50/30">
                    <td class="p-3 font-semibold text-indigo-950">${item.name}</td>
                    <td class="p-3 text-slate-600">${item.title}</td>
                    <td class="p-3">
                        ${item.preview ? `<img src="${item.preview}" class="w-10 h-10 object-cover rounded-lg border">` : `<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[10px]">${item.file}</span>`}
                    </td>
                    <td class="p-3">${getStatusBadge(item.status)}</td>
                    <td class="p-3 text-center space-x-1">
                        <button onclick="updateStatus(${item.id}, 'approved')" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-lg text-[11px] font-medium">อนุมัติ</button>
                        <button onclick="updateStatus(${item.id}, 'rejected')" class="px-2.5 py-1 bg-rose-100 text-rose-700 hover:bg-rose-200 rounded-lg text-[11px] font-medium">ให้แก้ไข</button>
                    </td>
                </tr>
            `).join('');
        }

        // Helper Badges
        function getStatusBadge(status) {
            if (status === 'approved') return `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-[10px] font-semibold">อนุมัติแล้ว</span>`;
            if (status === 'rejected') return `<span class="px-2 py-0.5 bg-rose-100 text-rose-700 rounded-full text-[10px] font-semibold">ต้องแก้ไข</span>`;
            return `<span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full text-[10px] font-semibold">รอตรวจ</span>`;
        }

        // Admin Action
        function updateStatus(id, newStatus) {
            const item = submissions.find(s => s.id === id);
            if (item) {
                item.status = newStatus;
                renderAdminTable();
                showToast(newStatus === 'approved' ? "อนุมัติงานเรียบร้อย" : "ส่งคืนงานให้แก้ไขแล้ว");
            }
        }

        // Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
        }
    </script>
</body>
</html>
